# Builds unsigned PG Lab AI desktop installers for macOS, Windows, and Linux and
# uploads them as workflow artifacts. Run it from the Actions tab.
#
# These are development-channel builds: no signing, notarization, or
# self-update. macOS warns on first open (right-click → Open) and Windows
# SmartScreen warns (More info → Run anyway). Signed release builds go through
# release.yml and the release-*-app.yml workflows once signing is configured.
name: Build desktop apps (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal app
        run: ORX_APP_UNIVERSAL=1 bash scripts/build-macos-app.sh

      - name: Package the DMG
        run: bash scripts/package-macos-app.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PG-Lab-AI-macos
          path: dist/PG-Lab-AI.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build orx and the launcher
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path windows/launcher/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force app-staging | Out-Null
          Copy-Item target/release/orx.exe app-staging
          Copy-Item windows/launcher/target/release/PG-Lab-AI.exe app-staging

      - name: Build the installer
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$PWD\app-staging" "/DOutputDir=$PWD\app-installer" windows\PG-Lab-AI.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PG-Lab-AI-windows
          path: app-installer/PG-Lab-AI-Setup.exe
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install WebKitGTK and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev file patchelf

      - name: Build orx
        run: cargo build --release --locked --features desktop

      - name: Package the AppImage
        run: scripts/build-linux-appimage.sh target/release/orx app-dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PG-Lab-AI-linux-${{ matrix.arch }}
          path: app-dist/PG-Lab-AI-${{ matrix.arch }}.AppImage
          if-no-files-found: error
